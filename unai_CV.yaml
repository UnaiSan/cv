cv:
  name: Unai San Miguel Alzórriz
  headline: Senior Expert in Wind Turbine Blades
  location: Navarra, Spain
  email: unai.sanmiguel@gmail.com
  photo: pictures/photo2021_150x220.jpg
  phone: +34 654 015 302
  website:
  social_networks:
    - network: LinkedIn
      username: unai-san-miguel-133b8329
    - network: GitHub
      username: UnaiSan
  custom_connections:
  sections:
    Personal:
      - Married, 3 daughters
      - Born in 1974 in Spain
      - "Languages: Spanish (native), English (fluent), French (basic)"
      - I like to cook and walk in nature
    Experience:
      - company: Nordex Technology
        position: Senior Expert in Wind Turbine Blades
        date:
        start_date: 2026
        end_date: present
        location: Navarra, Spain
        summary: I find solutions for the problems that come up in the preliminary design of wind turbine blades.
        highlights:
      - company: Nordex Energy
        position: Group Lead
        date:
        start_date: 2022
        end_date: 2026
        location: Navarra, Spain
        summary: I lead a small group of engineers who write python code to help in the aerodynamic design of wind turbine blades.
        highlights:
          - We introduced a real database with versioning for aerodynamic and materials design data
          - We implemented some software engineering techniques in our group and beyond, CI/CD, automated testing and deployment pipelines, documentation standards, linting, ...
          - We pushed for work group instead of individual efforts
          - I promoted insight thinking, critical analysis and knowledge sharing as core values within the group
      - company: Nordex / ACCIONA Windpower
        position: R&D Engineer
        date:
        start_date: 2010
        end_date: 2022
        location: Navarra, Spain
        summary: In the Blades design area, we developed tools to perform aerodynamic design and analysis of wind turbine blades.
        highlights:
          - Design of AW61.2, AW64.7, AW64.7_2 (with prebending) blades.
      - company: ACCIONA Windpower
        position: R&D Engineer
        date:
        start_date: 2007
        end_date: 2010
        location: Navarra, Spain
        summary: In the Patents and research area, I took part in research projects, managed some patents and did technological surveillance.
        highlights:
          - Researcher in project *EOLIA. Deep water offshore wind technologies*
      - company: Gamesa Eólica
        position: R&D Engineer
        date:
        start_date: 2000
        end_date: 2007
        location: Navarra, Spain
        summary: In the Aerodynamics, Loads and Siting area, I took part in projects with a broad scope. Calculation and certification of design loads, measured loads analyses, aerodynamic design of blades, complex terrain flow assessment, product support from the overall performance of the wind turbine point of view.
      - company: Gamesa Eólica
        position: R&D Intern
        date:
        start_date: 1999
        end_date: 2000
        location: Navarra, Spain
        summary: In the Aerodynamics, Loads and Siting area.

    Education:
      - institution: Universidad Politécnica de Madrid
        area: Aeronautical Engineer
        degree:
        date:
        start_date: 1992
        end_date: 2000
        location: Madrid, Spain
        summary:
        highlights:
          - "Master Thesis: Preliminary design of a wind turbine"

    Other:
      - company: Club Hielo Huarte
        position: President
        date:
        start_date: 2022
        end_date: 2026
        location: Navarra, Spain
        summary: My 3 daughters started playing ice hockey, one thing lead to the other, and I ended up in this position. A lot of new challenges, being the sport-related ones the easiest to manage. Dealing with our skaters and their families, Federations, other Clubs, sponsors, even local and regional government and media, has been a truly intense training for life and beyond.

    skills:
      - label: Programming
        details: Python, MATLAB, R
      - label: Communication
        details: Markdown, LaTeX, MS Office

    publications:
      - title: "Global sensitivity analysis of the blade geometry variables on the wind turbine performance."
        authors:
          - "*F. Echeverría*"
          - F. Mallor
          - U. San Miguel
        summary:
        doi: 10.1002/we.2111
        url:
        journal: Wind Energy
        date: 2017
      - title: Airfoil family design for large offshore wind turbine blades.
        authors:
          - B, Méndez
          - X. Munduate
          - U. San Miguel
        summary:
        doi: 10.1088/1742-6596/524/1/012022
        url:
        journal: "5th Science of Making Torque from Wind Conference, Volume: 524"
        date: 2014
      - title: Evolutionary blade design tool for maximizing energy in a wind turbine
        authors:
          - J. Sanz-Corretge
          - F. Echeverría
          - U. San Miguel
        summary:
        doi:
        url:
        journal: EWEA 2014, Barcelona
        date: 2014
      - title: "Flow over topographic configurations of interest: Comparison of results of different models."
        authors:
          - M. Esteban
          - A. Crespo
          - J. García
          - J. Hernández
          - U. San Miguel
        summary:
        doi:
        url:
        journal: EWEC 2001, Copenhagen
        date: 2001
